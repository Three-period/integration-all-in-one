name: Build GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'app.html'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          VITE_BASE_PATH: /integration-all-in-one/
      - name: Publish built files to the Pages source branch
        run: |
          mkdir -p assets
          rsync -a --delete dist/assets/ assets/
          cp dist/index.html index.html
          touch .nojekyll
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- index.html assets .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish GitHub Pages build"
            git push origin HEAD:main
          fi
