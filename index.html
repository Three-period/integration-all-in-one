<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="codex-preview" content="development" />
    <title>一体化产品研发系统 · V55.5 原型</title>
  </head>
  <body>
    <div class="app">
      <div class="brand"><span class="brand-mark"></span><span>一体化研发平台</span></div>
      <header class="topbar">
        <div class="crumb" id="crumb">个人工作台 / <strong>仪表盘</strong></div>
        <div class="global-search">
          ⌕<input id="globalSearch" placeholder="搜索项目、需求、任务或缺陷" />
        </div>
        <button class="top-icon" data-action="open-notifications" title="消息" aria-label="消息">
          🔔<span class="dot"></span></button
        ><button
          class="avatar top-avatar"
          data-profile-action="toggle"
          aria-label="打开个人菜单"
          title="个人菜单"
        >
          何
        </button>
        <div class="profile-menu" id="profileMenu">
          <div class="profile-menu-head">
            <span class="avatar profile-avatar">何</span>
            <div><strong>何盈</strong><small>产品经理 · 软件一科</small></div>
          </div>
          <button data-profile-action="personal">个人信息</button
          ><button data-profile-action="password">修改密码</button
          ><button class="danger" data-profile-action="logout">退出登录</button>
        </div>
      </header>
      <aside class="sidebar" id="sidebar"></aside>
      <main class="workspace"><div id="appView"></div></main>
    </div>
    <aside class="customizer" id="customizer">
      <div class="customizer-head">
        <h3>自定义工作台</h3>
        <button class="modal-close" data-action="close-customizer">×</button>
      </div>
      <div class="customizer-body" id="customizerBody"></div>
      <div class="customizer-foot">
        <button class="btn" data-action="reset-layout">恢复角色默认</button
        ><button class="btn primary" data-action="save-layout">保存布局</button>
      </div>
    </aside>
    <div class="drawer-mask" id="drawerMask" data-action="close-drawer"></div>
    <div class="drawer" id="drawer">
      <div class="drawer-head">
        <h3 id="drawerTitle">详情</h3>
        <button class="modal-close" data-action="close-drawer">×</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
      <div class="drawer-foot" id="drawerFoot"></div>
    </div>
    <div class="modal-mask" id="modalRoot"></div>
    <div class="toast-root" id="toastRoot"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
