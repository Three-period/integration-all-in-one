    function renderHelp(){const topics={start:{title:'快速开始',body:`<h2>快速开始</h2><p>一体化产品研发系统以项目为主线，将需求、设计、开发、测试、发布和结项数据纳入同一条研发链路。</p><h3>推荐使用路径</h3><ul><li>先在项目集中选择或创建项目，再进入项目管理查看完整项目上下文。</li><li>按生命周期阶段推进工作，阶段产物会自动归档到项目文档。</li><li>所有任务、缺陷、评审和变更均保留状态、版本与操作记录。</li></ul><h3>角色说明</h3><p>产品经理关注需求与设计；项目经理负责计划、资源与发布；研发人员执行任务与自测；测试人员负责用例、报告与缺陷闭环；主管查看部门运营和审批。</p>`},project:{title:'项目管理指南',body:`<h2>项目管理指南</h2><p>项目集只负责项目范围和入口。点击具体项目后，基本信息、项目概况、生命周期和项目调整均在同一个项目上下文内展开。</p><h3>数据自动继承</h3><p>从项目创建需求、从需求拆解任务、从任务关联版本时，项目名、负责人、版本等公共字段自动带出，不允许重复录入。</p><h3>发布前置条件</h3><p>严重缺陷全部关闭、三大测试报告审核通过、用例执行率达到阈值且 ECN / PCN 完成归档后，才可发起正式发布审批。</p>`},faq:{title:'常见问题 FAQ',body:`<h2>常见问题 FAQ</h2><div class="faq"><button data-action="faq">为什么我看不到某个项目？<br><span class="mini-note">项目范围由角色数据权限与项目成员关系共同决定。</span></button><button data-action="faq">为什么发布按钮是灰色？<br><span class="mini-note">系统预检发现缺陷、报告或归档条件未满足。</span></button><button data-action="faq">文档修改后旧版本还在吗？<br><span class="mini-note">每次修改都会产生新版本，旧版本只读保留。</span></button></div>`},changelog:{title:'版本更新日志',body:`<h2>版本更新日志</h2><div class="timeline"><div class="timeline-item"><b>V1.0 · 一体化研发闭环原型</b><small>2026-08-11 · 新增生命周期、运营看板与统一权限矩阵</small></div><div class="timeline-item"><b>V0.9 · 工作台卡片权限</b><small>2026-08-05 · 支持角色可见范围与个人布局自定义</small></div></div>`}};const t=topics[state.helpTab]||topics.start;return `<section class="page">${commonHead('帮助文档','帮助中心','按角色和业务场景快速定位平台使用说明。','<button class="btn primary" data-action="feedback">提交反馈</button>')}<div class="card card-pad help-card"><nav class="help-menu"><div class="global-search" style="width:100%;margin-bottom:12px">⌕ <input placeholder="搜索帮助内容"></div>${[['start','快速开始'],['project','项目管理指南'],['faq','常见问题 FAQ'],['changelog','版本更新日志']].map(([k,n])=>`<button class="${state.helpTab===k?'active':''}" data-action="help-tab" data-tab="${k}">${n}</button>`).join('')}</nav><article class="help-article">${t.body}</article></div></section>`}

    function renderHelp(){const topics={
      start:{title:'快速开始',body:`<h2>平台定位与核心功能</h2><p>一体化产品研发平台以项目为主线，将需求、设计、开发、测试、发布和运营/结项数据纳入同一条可追溯链路。</p><h3>适用角色</h3><p>产品经理关注需求与设计；项目经理负责计划、资源与发布；研发人员执行开发任务与自测；测试人员负责用例、报告与缺陷闭环；部门主管查看组织运营与审批。</p><h3>推荐路径</h3><p>先从项目集选择项目，再进入项目管理；项目阶段产物自动归档，历史版本与操作记录可回溯。</p>`},

      const topics={
        start:{title:'产品整体介绍',body:`<h2>一体化产品研发平台</h2><p>平台以项目为主线，把项目集、需求、方案、开发、测试、发布、结项和运营数据放入同一个可追溯链路，减少重复填报和跨系统确认。</p><div class="help-section-grid"><div class="card"><h3>平台定位</h3><p>面向软件研发团队的一体化研发过程管理与数据治理平台。</p></div><div class="card"><h3>核心功能概览</h3><p>个人工作台、项目集、项目管理、运营看板、系统配置和帮助文档。</p></div><div class="card"><h3>适用角色</h3><p>产品经理、项目经理、研发人员、测试人员、部门主管和系统管理员。</p></div><div class="card"><h3>统一数据主线</h3><p>项目 → 需求 → 任务 → 用例 → 缺陷 → 版本 → 发布；所有状态变更保留版本与审计记录。</p></div></div><div class="help-rule">使用原则：先从项目集选择项目，再进入项目管理；项目内所有页面共享同一 project_id。</div>`},
        personal:{title:'个人工作台使用指南',body:`<h2>个人工作台使用指南</h2><p>工作台根据当前角色计算可见卡片，再叠加个人显示、排序和尺寸偏好。</p><h3>卡片布局</h3><ul><li>支持隐藏、显示、拖拽排序、调整尺寸和恢复角色默认布局。</li><li>个人自定义不能突破功能权限、角色数据范围、项目成员关系和数据密级约束。</li><li>切换角色后重新获取该角色的卡片权限和布局，不复用其他角色的数据。</li></ul><h3>五个工作入口</h3><p>我的任务承载执行项；我的流程承载审批；我的日历承载任务、会议和里程碑；我的文档承载收藏与跨项目参考；我的联系人承载协作与指派。</p>`},
        portfolio:{title:'项目集管理使用指南',body:`<h2>项目集管理使用指南</h2><p>项目集只负责管理所有项目的范围、状态和入口，不承载某一个项目的完整详情。</p><h3>项目操作</h3><ul><li>支持卡片 / 列表视图、状态筛选、负责人筛选、项目类型筛选、周期筛选和排序。</li><li>点击项目卡片后写入 project_id，默认进入项目概况。</li><li>归档项目按权限进入只读态；切换项目时清除旧缓存并重新鉴权。</li></ul>`},
        project:{title:'项目管理使用指南',body:`<h2>项目管理使用指南</h2><p>项目管理左侧固定承载基本信息、项目概况、全生命周期和项目调整；右侧只展示当前项目内容。</p><h3>项目生命周期</h3><p>规划、需求、设计、开发、测试、发布、运营/结项阶段的文档、任务、用例、缺陷、变更和风险都回写当前项目。</p><h3>文档与版本</h3><p>阶段文档按阶段归档，每次提交产生新版本；评审通过后锁定，修改必须发起变更并保留前后版本。</p><h3>发布阻断</h3><p>严重缺陷未关闭、测试报告未审核通过或 ECN/PCN 未归档时，正式发布审批不可发起；紧急发布需独立审批并补充复盘。</p>`},
        operations:{title:'运营看板使用指南',body:`<h2>运营看板使用指南</h2><p>运营看板只读取经过权限过滤的项目、人员、质量和资源数据，不直接修改底层业务数据。</p><div class="help-section-grid"><div class="card"><h3>项目运营看板</h3><p>总览卡片、健康度矩阵、重点项目、延期风险预警、质量趋势、缺陷闭环监控和测试进度。</p></div><div class="card"><h3>人员运营看板</h3><p>人员负载总览、部门成员列表、个人项目明细、卡点与风险标注、资源空闲度和人员效能趋势。</p></div><div class="card"><h3>资源分配看板</h3><p>部门资源池、项目资源占用、冲突预警、资源需求预测和跨部门调配审批留痕。</p></div><div class="card"><h3>指标口径</h3><p>展示口径版本和计算时间；源数据事件增量刷新，每日执行全量校准；点击指标可下钻到项目或人员明细。</p></div></div>`},

        faq:{title:'常见问题 FAQ',body:`<h2>常见问题 FAQ</h2><p>按角色查看常见使用问题。问题内容与产品版本同步维护。</p><div class="help-role-tabs">${[['all','全部'],['dev','开发篇'],['test','测试篇'],['manager','主管篇'],['admin','管理员篇']].map(x=>`<button class="${faqRole===x[0]?'active':''}" data-action="help-faq-role" data-role="${x[0]}">${x[1]}</button>`).join('')}</div><div class="faq">${faqData[faqRole].map(x=>`<button data-action="faq"><b>${x[0]}</b><br><span class="mini-note">${x[1]}</span></button>`).join('')}</div>`},
        changelog:{title:'版本更新日志',body:`<h2>版本更新日志</h2><div class="timeline"><div class="timeline-item"><b>V1.2 · 三大板块内容补齐</b><small>2026-08-11 · 补齐运营看板、系统配置和帮助文档的实际承载页面与交互</small></div><div class="timeline-item"><b>V1.1 · 信息架构全量覆盖</b><small>2026-08-11 · 增加全量节点视图和页面跳转审查</small></div><div class="timeline-item"><b>V1.0 · 一体化研发闭环原型</b><small>2026-08-11 · 完成生命周期、工作台和统一权限矩阵</small></div></div><h3>修复问题记录</h3><p>本轮修复“节点已登记但页面只有概览”的问题，所有三大板块节点均有可见内容、操作入口或详情承载。</p>`},
        feedback:{title:'在线反馈入口',body:`<h2>提交使用问题或改进建议</h2><p>反馈会记录模块、页面、问题类型、优先级和描述，并生成产品 backlog 关联编号，后续可在产品待办中跟踪。</p><div class="help-rule">反馈提交后：创建反馈单 → 生成 backlog 编号 → 产品负责人 triage → 进入版本排期或关闭。</div><button class="btn primary" data-action="help-feedback">打开在线反馈表单</button>`}
      };
      const menu=[['start','产品整体介绍'],['personal','个人工作台使用指南'],['portfolio','项目集管理使用指南'],['project','项目管理使用指南'],['operations','运营看板使用指南'],['settings','系统配置使用指南'],['architecture','信息架构全量视图'],['faq','常见问题 FAQ'],['changelog','版本更新日志'],['feedback','在线反馈入口']];

    function collectBug(){
      var r=bugCurrent(),body=$('#drawerBody');

      r.updated='刚刚';

    function saveBug(mode){
      var r=collectBug();
      if(mode==='verify')r.status='进行中';

        r.id='DFT-NEW-'+Date.now();
        r.created='2026-08-16';
        r.creator='何盈';
        r.updated='刚刚';
        r.versions=[{version:'V1.0',status:'当前版本',creator:r.creator,time:'刚刚',summary:r.summary||'新建缺陷记录'}];
        state.bugRecords.unshift(Object.assign({},r,{comments:r.comments||[],relations:r.relations||[]}));
        state.bugSelected=r.id;
        state.bugDraft=null;
      }
      closeDrawer();render();showToast(mode==='verify'?'缺陷已提交验证':'缺陷草稿已保存');

/* V54.0: unify document-driven stage approval and report-list workflow.

(function(){

  }
  // A new draft supersedes an earlier approved version; preloaded legacy versions use
  // their version numbers to decide which is current.
  function v54CurrentDesign(type){
    designInit();
    var rows=state.designRecords.filter(function(x){return x.docType===type});
    function vnum(x){
      var m=String(x.version||'').match(/(\d+)\.(\d+)(?:\.(\d+))?/);
      return m?Number(m[1])*1000000+Number(m[2])*1000+Number(m[3]||0):0;
    }
    rows.sort(function(a,b){
      var an=/^DSN-NEW-/.test(a.id),bn=/^DSN-NEW-/.test(b.id);
      if(an!==bn)return an?-1:1;
      if(an&&bn)return Number(b.id.slice(8))-Number(a.id.slice(8));
      return vnum(b)-vnum(a);
    });
    return rows[0]||null;
  }
  function v54MissingDesign(){
    return v54DesignTypes().filter(function(type){
      var r=v54CurrentDesign(type);
      return !r||['评审通过','已结束'].indexOf(r.status)<0;
    });
  }
  var oldDesignApprove=v47ApproveStage;

    }

  };

  // Report list storage is project/type scoped; migrate meaningful V53.1 single-record
  // data without overwriting existing histories, rich content or frozen comments.
  var oldRecord=v37Record;
  function v54Bucket(kind){
    if(!state.v54Reports)state.v54Reports=Object.create(null);
    var pid=state.projectId;
    if(!state.v54Reports[pid])state.v54Reports[pid]=Object.create(null);
    var bucket=state.v54Reports[pid][kind];
    if(!bucket){
      bucket={rows:[],selectedId:''};
      state.v54Reports[pid][kind]=bucket;
      var old=state.v37Reports&&state.v37Reports[pid]&&state.v37Reports[pid][kind];
      if(old&&(old.status!=='草稿'||old.conclusion||(old.history&&old.history.length))){
        var copy=Object.assign({id:'LEGACY-'+pid+'-'+kind,createdAt:old.at||v54Now()},old);
        if(!Array.isArray(copy.history))copy.history=[];
        bucket.rows.push(copy);bucket.selectedId=copy.id;
      }
    }
    return bucket;
  }
  v37Record=function(kind){
    if(v54Kinds.indexOf(kind)<0)return oldRecord(kind);
    var b=v54Bucket(kind);
    if(state.v54Draft&&state.v54Draft.kind===kind)return state.v54Draft.row;
    return b.rows.find(function(r){return r.id===b.selectedId})||b.rows[0]||oldRecord(kind);
  };
  function v54Rows(kind){return v54Bucket(kind).rows}
  function v54ReadyReport(kind,commit){
    if(!v54Enabled(kind))return {ready:true,skipped:true};
    var rows=v54Rows(kind),matching=rows.find(function(r){

  }
  function v54ReportRequirements(){
    var z=v52Status(),result={commit:z.commit,items:[],missing:[]};

      if(!r.ready)result.missing.push(v54Names[kind]);

  }

      +'<button class="btn" data-v54-report="clear">重置</button><span class="mini-note">共 '+rows.length+' 份报告</span></div>'
      +'<div class="testing-table-wrap"><table class="testing-table"><thead><tr><th>报告名称</th><th>关联版本</th><th>状态</th><th>负责人</th><th>最近更新</th><th>操作</th></tr></thead><tbody>'
